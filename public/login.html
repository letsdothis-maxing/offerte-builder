<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OfferteBuilder — Inloggen</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
  }
  .card {
    width: 100%; max-width: 360px; margin: 16px; padding: 32px;
    background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
  }
  h1 { font-size: 20px; margin: 0 0 24px; text-align: center; }
  h1 span { color: #2563eb; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #374151; }
  input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 16px;
    border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px;
  }
  input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  button {
    width: 100%; padding: 11px; background: #2563eb; color: #fff; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  button:hover:not(:disabled) { background: #1d4ed8; }
  #error { display: none; margin-bottom: 16px; padding: 10px 12px; border-radius: 8px; background: #fef2f2; color: #b91c1c; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Offerte<span>Builder</span></h1>
    <form id="login-form">
      <div id="error"></div>
      <label for="email">E-mailadres</label>
      <input type="email" id="email" name="email" autocomplete="username" required>
      <label for="password">Wachtwoord</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" id="submit-btn">Inloggen</button>
    </form>
  </div>
  <script>
    var form = document.getElementById("login-form");
    var errorEl = document.getElementById("error");
    var submitBtn = document.getElementById("submit-btn");
    form.addEventListener("submit", async function(e){
      e.preventDefault();
      errorEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Bezig…";
      try {
        var res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });
        if (res.ok) {
          location.href = "/";
          return;
        }
        var data = await res.json().catch(function(){ return {}; });
        errorEl.textContent = data.error || "Inloggen mislukt.";
        errorEl.style.display = "";
      } catch (err) {
        errorEl.textContent = "Inloggen mislukt. Probeer opnieuw.";
        errorEl.style.display = "";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Inloggen";
      }
    });
  </script>
</body>
</html>
